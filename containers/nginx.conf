pid /tmp/nginx/nginx.pid;
error_log stderr;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    # Compose service names resolve at request time, so a restarting backend does not stop nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 0;
        proxy_http_version 1.1;
        set $apiserver http://apiserver:8008;
        set $fileserver http://fileserver:8081;
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'self'";
            try_files $uri $uri/ /index.html;
        }
        location /version.json { add_header Cache-Control 'no-cache'; }
        location = /offline/updates { return 204; }
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $apiserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }
        location /files/ {
            rewrite ^/files/(.*)$ /$1 break;
            proxy_pass $fileserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /widgets/ {
            alias /usr/share/nginx/widgets/;
            try_files $uri $uri/ /widgets/index.html;
            add_header Content-Security-Policy "frame-ancestors *";
        }
    }
}
